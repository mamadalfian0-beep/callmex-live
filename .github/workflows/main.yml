
name: Deploy Callmex Live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode website
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy ke Firebase Hosting
        run: firebase deploy --only hosting --project callmex-live --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
